<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>요리조리 런 로고</title>
<!-- Logo drawing page. Run: node tools/store-screenshots/serve.mjs <out-folder>, then open
     http://127.0.0.1:8145/design/title-icon/logo.html  (add ?save=1 to POST each PNG to /save).
     Fonts (all SIL Open Font License 1.1): Jua and Black Han Sans from Google Fonts,
     Galmuri11 Bold (pixel font by Lee Minseo) from the galmuri npm package via jsDelivr.
     The game uses concept C3. To rebuild the in-game logo: run the server with an output folder,
     open logo.html?c=C3&save=1, then node design/title-icon/make-logo.cjs <that folder>. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
  body { margin: 0; background: #3a2a5a; color: #fff; font: 14px sans-serif; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
  figure { margin: 0; background: repeating-conic-gradient(#4a3a6a 0 25%, #3a2a5a 0 50%) 0 0 / 24px 24px; }
  canvas { display: block; width: 540px; height: auto; }
  figcaption { padding: 6px 8px; background: #1b1035; }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>
const W = 1080, H = 600;
const SYL = ['요', '리', '조', '리'];
const C = {
  yellow: '#FFC93C', orange: '#FF8A2A', ink: '#1B1035', plum: '#2A1A4A',
  sky: '#4DB8FF', skyDeep: '#1E7FD0', red: '#E63946', white: '#FFFFFF', cream: '#F5EBD7',
};

function canvas() { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; }

/** Outlined, filled text with a hard drop shadow; `fill` may be a gradient. */
function sticker(ctx, text, x, y, { font, fill, stroke = C.ink, strokeW = 22, shadow = 12, rim = 0, rimColor = C.white, angle = 0, skew = 0 }) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  if (skew) ctx.transform(1, 0, skew, 1, 0, 0);
  ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round'; ctx.miterLimit = 2;
  if (shadow) { ctx.lineWidth = strokeW + rim * 2; ctx.strokeStyle = C.ink; ctx.strokeText(text, 0, shadow); ctx.fillStyle = C.ink; ctx.fillText(text, 0, shadow); }
  if (rim) { ctx.lineWidth = strokeW + rim * 2; ctx.strokeStyle = rimColor; ctx.strokeText(text, 0, 0); }
  ctx.lineWidth = strokeW; ctx.strokeStyle = stroke; ctx.strokeText(text, 0, 0);
  ctx.fillStyle = fill; ctx.fillText(text, 0, 0);
  ctx.restore();
}

function vgrad(ctx, y0, y1, a, b) { const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, a); g.addColorStop(1, b); return g; }

function streaks(ctx, x, y, n, len, color, gap = 26, w = 12) {
  ctx.save(); ctx.lineCap = 'round'; ctx.strokeStyle = color; ctx.lineWidth = w;
  for (let i = 0; i < n; i++) {
    const l = len * (i % 2 ? 0.6 : 1);
    ctx.beginPath(); ctx.moveTo(x - l, y + i * gap); ctx.lineTo(x, y + i * gap); ctx.stroke();
  }
  ctx.restore();
}

// A: rounded "jelly bounce" — each syllable hops up and down (요리조리 = zig-zag).
function conceptA() {
  const c = canvas(), ctx = c.getContext('2d');
  const font = '200px Jua';
  const xs = [190, 390, 600, 810], ys = [250, 205, 250, 205], tilt = [-0.10, 0.08, -0.08, 0.10];
  // a dotted zig-zag trail through the syllables
  ctx.save(); ctx.setLineDash([2, 30]); ctx.lineCap = 'round'; ctx.lineWidth = 14; ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.beginPath(); ctx.moveTo(90, 300); [[290, 250], [500, 300], [705, 250], [900, 300]].forEach(([x, y]) => ctx.lineTo(x, y)); ctx.stroke(); ctx.restore();
  SYL.forEach((s, i) => sticker(ctx, s, xs[i], ys[i], { font, fill: vgrad(ctx, ys[i] - 160, ys[i], C.yellow, C.orange), angle: tilt[i], rim: 8 }));
  streaks(ctx, 470, 420, 3, 150, C.white);
  sticker(ctx, '런', 600, 520, { font: '230px Jua', fill: vgrad(ctx, 340, 520, '#8FD6FF', C.skyDeep), angle: -0.06, rim: 8 });
  return c;
}

// B: arcade pixel — Galmuri11 Bold drawn tiny, then blown up with hard pixels and a stepped 3D edge.
function conceptB() {
  const SW = 110, SH = 60;
  // 1) A hard 0/1 glyph mask per color group, drawn at the font's native pixel size.
  const mask = (draw) => {
    const m = document.createElement('canvas'); m.width = SW; m.height = SH;
    const g = m.getContext('2d'); g.font = 'bold 12px Galmuri11'; g.textBaseline = 'alphabetic'; g.fillStyle = '#000';
    draw(g);
    const d = g.getImageData(0, 0, SW, SH).data, out = new Uint8Array(SW * SH);
    for (let i = 0; i < out.length; i++) out[i] = d[i * 4 + 3] > 110 ? 1 : 0;
    return out;
  };
  const top = mask((g) => SYL.forEach((ch, i) => g.fillText(ch, 29 + i * 13, i % 2 ? 21 : 23)));
  const run = mask((g) => g.fillText('런', 49, 42));
  const at = (m, x, y) => (x >= 0 && y >= 0 && x < SW && y < SH ? m[y * SW + x] : 0);
  // 2) Layers, back to front: ink outline (mask grown by 1 plus the extrusion), extrusion, face.
  const small = document.createElement('canvas'); small.width = SW; small.height = SH;
  const s = small.getContext('2d');
  const paint = (test, color) => {
    s.fillStyle = color;
    for (let y = 0; y < SH; y++) for (let x = 0; x < SW; x++) if (test(x, y)) s.fillRect(x, y, 1, 1);
  };
  const DEPTH = 2;
  const solid = (m, x, y) => { for (let k = 0; k <= DEPTH; k++) if (at(m, x - k, y - k)) return true; return false; };
  const grown = (m, x, y) => { for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (solid(m, x + dx, y + dy)) return true; return false; };
  paint((x, y) => grown(top, x, y) || grown(run, x, y), C.ink);
  paint((x, y) => solid(top, x, y) && !at(top, x, y), C.orange);
  paint((x, y) => solid(run, x, y) && !at(run, x, y), C.skyDeep);
  paint((x, y) => at(top, x, y), C.yellow);
  paint((x, y) => at(run, x, y), C.sky);
  // a one-pixel highlight on the top edge of each face
  paint((x, y) => at(top, x, y) && !at(top, x, y - 1), '#FFF1B8');
  paint((x, y) => at(run, x, y) && !at(run, x, y - 1), '#C9ECFF');
  const c = canvas(), ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const k = 10;
  ctx.drawImage(small, (W - SW * k) / 2, 10, SW * k, SH * k);
  // pixel speed streaks next to 런
  ctx.fillStyle = C.white;
  for (const [x, y, w] of [[360, 330, 90], [320, 370, 130], [370, 410, 80]]) ctx.fillRect(x, y, w, 18);
  return c;
}

// C: speed sticker — heavy slanted Black Han Sans with a white rim, dashing forward.
function conceptC() {
  const c = canvas(), ctx = c.getContext('2d');
  const font = '190px "Black Han Sans"';
  const xs = [215, 405, 605, 800], ys = [250, 225, 250, 225];
  streaks(ctx, 150, 140, 4, 120, C.white, 34, 14);
  SYL.forEach((s, i) => sticker(ctx, s, xs[i], ys[i], { font, fill: vgrad(ctx, ys[i] - 150, ys[i], C.yellow, C.orange), skew: -0.22, rim: 12, strokeW: 18 }));
  // 런 in a sky-blue tag
  ctx.save(); ctx.translate(560, 450); ctx.transform(1, 0, -0.22, 1, 0, 0);
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.roundRect(-150, -120 + 12, 300, 165, 34); ctx.fill();
  ctx.fillStyle = C.white; ctx.beginPath(); ctx.roundRect(-150, -120, 300, 165, 34); ctx.fill();
  ctx.fillStyle = C.sky; ctx.beginPath(); ctx.roundRect(-138, -108, 276, 141, 26); ctx.fill();
  ctx.restore();
  sticker(ctx, '런', 560, 485, { font: '150px "Black Han Sans"', fill: C.white, skew: -0.22, strokeW: 16, shadow: 0 });
  streaks(ctx, 330, 395, 3, 110, C.white, 30, 12);
  return c;
}

/** A slanted rounded tag (ink shadow, white rim, colored face) centered at (x, y). */
function tag(ctx, x, y, w, h, face, skew = -0.22) {
  ctx.save(); ctx.translate(x, y); ctx.transform(1, 0, skew, 1, 0, 0);
  const r = h * 0.22;
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2 + 12, w, h, r); ctx.fill();
  ctx.fillStyle = C.white; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, r); ctx.fill();
  ctx.fillStyle = face; ctx.beginPath(); ctx.roundRect(-w / 2 + 12, -h / 2 + 12, w - 24, h - 24, r * 0.75); ctx.fill();
  ctx.restore();
}

// C2: one long line, 요리조리 then 런 in a tag at the end, all dashing right.
function conceptC2() {
  const c = canvas(), ctx = c.getContext('2d');
  const font = '165px "Black Han Sans"';
  const y = 360;
  streaks(ctx, 115, 230, 4, 90, C.white, 34, 13);
  ['요', '리', '조', '리'].forEach((s, i) => sticker(ctx, s, 195 + i * 160, y, { font, fill: vgrad(ctx, y - 130, y, C.yellow, C.orange), skew: -0.22, rim: 11, strokeW: 17 }));
  tag(ctx, 900, y - 58, 200, 180, C.sky);
  sticker(ctx, '런', 900, y - 5, { font: '135px "Black Han Sans"', fill: C.white, skew: -0.22, strokeW: 15, shadow: 0 });
  return c;
}

// C3: the syllables zig-zag up and down over a zig-zag arrow that runs into 런.
function conceptC3() {
  const c = canvas(), ctx = c.getContext('2d');
  const font = '175px "Black Han Sans"';
  const ys = [235, 300, 235, 300];
  // Hangul syllables all advance the same width, but a narrow one like 리 leaves empty space, so
  // fixed positions looked uneven. Space them by their inked extents instead, with an even gap.
  ctx.font = font; ctx.textAlign = 'center';
  const GAP = 44;
  const xs = [];
  let x = 95;
  for (const s of SYL) {
    const m = ctx.measureText(s);
    const left = m.actualBoundingBoxLeft, right = m.actualBoundingBoxRight; // around the anchor
    xs.push(x + left); // the anchor sits `left` px right of the ink's left edge
    x += left + right + GAP;
  }
  const path = [[85, 375], [250, 430], [440, 375], [630, 430], [800, 380]];
  const line = (w, color) => {
    ctx.save(); ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = w; ctx.strokeStyle = color;
    ctx.beginPath(); path.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
    ctx.restore();
  };
  const head = (grow, color) => {
    ctx.save(); ctx.fillStyle = color; ctx.beginPath();
    ctx.moveTo(845 + grow, 365); ctx.lineTo(780 - grow, 335 - grow); ctx.lineTo(795 - grow, 410 + grow); ctx.closePath(); ctx.fill();
    ctx.restore();
  };
  line(34, C.ink); head(10, C.ink); line(18, C.white); head(0, C.white);
  SYL.forEach((s, i) => sticker(ctx, s, xs[i], ys[i], { font, fill: vgrad(ctx, ys[i] - 140, ys[i], C.yellow, C.orange), skew: -0.2, rim: 11, strokeW: 17, angle: i % 2 ? 0.05 : -0.05 }));
  sticker(ctx, '런', 935, 430, { font: '230px "Black Han Sans"', fill: vgrad(ctx, 270, 430, '#8FD6FF', C.skyDeep), skew: -0.2, rim: 12, strokeW: 18 });
  return c;
}

// C4: C in the riders' team colors — sky-blue 요리조리, a red 런 tag, yellow speed lines.
function conceptC4() {
  const c = canvas(), ctx = c.getContext('2d');
  const font = '190px "Black Han Sans"';
  const xs = [215, 405, 605, 800], ys = [250, 225, 250, 225];
  streaks(ctx, 150, 140, 4, 120, C.yellow, 34, 14);
  SYL.forEach((s, i) => sticker(ctx, s, xs[i], ys[i], { font, fill: vgrad(ctx, ys[i] - 150, ys[i], '#9EDCFF', C.skyDeep), skew: -0.22, rim: 12, strokeW: 18 }));
  tag(ctx, 560, 433, 300, 165, C.red);
  sticker(ctx, '런', 560, 485, { font: '150px "Black Han Sans"', fill: C.white, skew: -0.22, strokeW: 16, shadow: 0 });
  streaks(ctx, 330, 395, 3, 110, C.yellow, 30, 12);
  return c;
}

const concepts = {
  A: ['A 말랑 바운스 (Jua)', conceptA], B: ['B 아케이드 픽셀 (Galmuri11)', conceptB], C: ['C 질주 스티커 (Black Han Sans)', conceptC],
  C2: ['C2 한 줄 질주', conceptC2], C3: ['C3 지그재그', conceptC3], C4: ['C4 주인공 색', conceptC4],
};

(async () => {
  await document.fonts.load('200px Jua', '요리조리런');
  await document.fonts.load('200px "Black Han Sans"', '요리조리런');
  await document.fonts.load('bold 12px Galmuri11', '요리조리런');
  const only = new URLSearchParams(location.search).get('c');
  for (const [key, [label, make]] of Object.entries(concepts)) {
    if (only && only !== key) continue;
    const c = make();
    const fig = document.createElement('figure');
    fig.append(c);
    const cap = document.createElement('figcaption'); cap.textContent = label; fig.append(cap);
    document.getElementById('row').append(fig);
    if (new URLSearchParams(location.search).get('save')) {
      const blob = await new Promise((r) => c.toBlob(r));
      await fetch('/save?name=logo_' + key + '.png', { method: 'POST', body: blob });
    }
  }
  document.title = 'done';
})();
</script>
</body>
</html>
